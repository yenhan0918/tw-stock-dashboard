name: Daily premarket dashboard

on:
  schedule:
    - cron: "20 0 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      DASHBOARD_URL: "https://yenhan0918.github.io/tw-stock-dashboard/"
      PAGES_WAIT_STRICT: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Validate email configuration
        run: |
          missing=0
          for name in SMTP_HOST SMTP_USER SMTP_PASS; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing email secret::$name is required for automatic Gmail delivery"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Generate dashboard
        run: npm run generate

      - name: Commit dashboard update
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Daily premarket dashboard update
          file_pattern: index.html

      - name: Wait for GitHub Pages update
        run: npm run wait-for-pages

      - name: Send email summary
        run: npm run send-email
